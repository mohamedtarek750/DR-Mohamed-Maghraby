<!doctype html>
<!--
  Share card (Open Graph / Twitter) for the website. 1200 x 630.
  Source of public/og/editorial-1200x630-{ar,en}.png. Re-export with:
    npm run og:export
  Pass ?lang=ar or ?lang=en. Built from the site's own tokens and portrait,
  so the card and the page read as one identity.

  Banner rules applied (ui-ux-pro-max banner-design):
  - critical content inside the central 80% (120px side margins)
  - two typefaces at most per card, headline >= 32px, body >= 16px
  - text contrast >= 4.5:1, one CTA >= 44px tall
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,300&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ivory: #f4f0e8;
        --paper-deep: #ece6db;
        --ink: #191d18;
        --ink-soft: #4d544a;
        --ink-mute: #63695e;
        --sage: #75846a;
        --sage-deep: #3a4535;
        --sage-wash: #e6e7dd;
        --clay: #b6a893;
        --line: #ddd6c8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--ivory);
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
        position: relative;
      }
      [dir='rtl'] body, body[dir='rtl'] { font-family: 'IBM Plex Sans Arabic', sans-serif; }

      /* Top wash, as on the site's hero. */
      .wash {
        position: absolute; inset: 0 0 auto 0; height: 360px;
        background: radial-gradient(120% 90% at 50% 0%, rgba(230, 231, 221, 0.9), transparent 70%);
      }
      /* A still frame of the site's "thought field": the lattice, settled. */
      .field { position: absolute; inset: 0; }

      .portrait {
        position: absolute; bottom: 0; inset-inline-end: 96px;
        width: 400px; height: 560px;
      }
      .arch {
        position: absolute; inset: 44px 16px 0 16px;
        border-radius: 200px 200px 0 0;
        background: linear-gradient(180deg, var(--sage-wash), var(--paper-deep));
        box-shadow: inset 0 0 0 1px rgba(182, 168, 147, 0.35);
      }
      .portrait img {
        position: absolute; bottom: 0; left: 0; width: 400px; height: auto;
        filter: drop-shadow(0 24px 36px rgba(25, 29, 24, 0.16));
      }

      .copy {
        position: absolute; top: 0; bottom: 0; inset-inline-start: 120px;
        width: 560px;
        display: flex; flex-direction: column; justify-content: center;
      }
      .eyebrow {
        font-size: 20px; letter-spacing: 0.16em; text-transform: uppercase;
        color: var(--ink-mute); font-weight: 500;
      }
      [dir='rtl'] .eyebrow { letter-spacing: 0; text-transform: none; font-size: 24px; font-weight: 400; }

      .name {
        margin-top: 26px;
        font-family: 'Source Serif 4', serif; font-weight: 300;
        font-size: 80px; line-height: 1.04; letter-spacing: -0.015em;
      }
      [dir='rtl'] .name {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        font-size: 92px; line-height: 1.2; letter-spacing: 0;
      }
      .title { margin-top: 18px; font-size: 30px; color: var(--sage-deep); }
      [dir='rtl'] .title { font-size: 34px; }

      .rule { margin-top: 40px; height: 1px; width: 100%; background: var(--line); }
      .cta {
        margin-top: 30px; align-self: flex-start;
        height: 60px; padding: 0 30px;
        display: inline-flex; align-items: center;
        background: var(--ink); color: #fbf8f2;
        font-size: 22px; font-weight: 500; border-radius: 4px;
      }
      [dir='rtl'] .cta { font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="wash"></div>
    <svg class="field" viewBox="0 0 1200 630" aria-hidden="true"></svg>

    <div class="portrait">
      <div class="arch"></div>
      <img src="../../../public/images/dr-mohamed-maghraby.png" alt="" />
    </div>

    <div class="copy">
      <p class="eyebrow" data-k="eyebrow"></p>
      <h1 class="name" data-k="name"></h1>
      <p class="title" data-k="title"></p>
      <div class="rule"></div>
      <span class="cta" data-k="cta"></span>
    </div>

    <script>
      const copy = {
        ar: {
          eyebrow: 'عيادات د. محمد مغربي',
          name: 'د. محمد مغربي',
          title: 'دكتور أمراض نفسية وعصبية',
          cta: 'احجز موعدك',
        },
        en: {
          eyebrow: 'Neurology & Psychiatry',
          name: 'Dr. Mohamed Maghraby',
          title: 'Neuropsychiatrist',
          cta: 'Book an appointment',
        },
      };
      const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.body.dir = document.documentElement.dir;
      for (const el of document.querySelectorAll('[data-k]')) el.textContent = copy[lang][el.dataset.k];

      // Settled lattice, deterministic so every export is identical. Kept to
      // the portrait side and the top band so it never sits behind the text.
      const svg = document.querySelector('.field');
      const cols = 11, rows = 6, pts = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = ((c + 0.5) / cols) * 1200 + Math.sin(r * 1.7) * 9;
          const y = ((r + 0.5) / rows) * 630 + Math.cos(c * 1.3) * 9;
          const textSideX = lang === 'ar' ? x > 600 : x < 640;
          if (textSideX && y > 90) continue;
          pts.push([x, y]);
        }
      }
      const ns = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < pts.length; i++) {
        for (let j = i + 1; j < pts.length; j++) {
          const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
          if (d > 150) continue;
          const l = document.createElementNS(ns, 'line');
          l.setAttribute('x1', pts[i][0]); l.setAttribute('y1', pts[i][1]);
          l.setAttribute('x2', pts[j][0]); l.setAttribute('y2', pts[j][1]);
          l.setAttribute('stroke', `rgba(117,132,106,${(0.26 * (1 - d / 150)).toFixed(3)})`);
          svg.appendChild(l);
        }
      }
      for (const [x, y] of pts) {
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 2);
        c.setAttribute('fill', 'rgba(58,69,53,0.4)');
        svg.appendChild(c);
      }
    </script>
  </body>
</html>
